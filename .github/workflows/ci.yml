name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp_gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: whatsapp_gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Integration (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@06749dd8c0b54f350bc69c8752456cee498808a3 # master 2026-09-27

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: "false"

  addon-lint:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./whatsapp_gateway

  # Build only, no push. The legacy home-assistant/builder action (with
  # --test/--target) is deprecated and cannot be pinned by SHA (it derives its
  # image tag from the ref), so this uses the maintained build-image action.
  addon-build:
    name: Add-on build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: whatsapp_gateway
          image: whatsapp-gateway-ci
          image-tags: ci
          version: ci
          push: "false"
          cosign: "false"
          cache-gha: "false"
          container-registry-password: ${{ github.token }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.24

  # Supervisor runs the add-on confined by apparmor.txt. Plain `docker run` does
  # not, so load the profile on the runner (Ubuntu has AppArmor enabled) and run
  # the smoke test inside it, failing on any denial.
  addon-apparmor:
    name: Add-on under AppArmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load AppArmor profile
        run: |
          sudo aa-status --enabled
          sudo apparmor_parser -r -W whatsapp_gateway/apparmor.txt
          sudo aa-status | grep -F whatsapp_gateway
      - name: Smoke test under the profile
        env:
          SMOKE_DOCKER_ARGS: --security-opt apparmor=whatsapp_gateway
        run: sh scripts/smoke.sh
      - name: Check for AppArmor denials
        if: always()
        run: |
          denials=$(sudo dmesg | grep -F 'apparmor="DENIED"' | grep -F 'profile="whatsapp_gateway' || true)
          if [ -n "$denials" ]; then
            echo "$denials"
            exit 1
          fi
          echo "No AppArmor denials"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # gitleaks CLI over the full history (the gitleaks action mis-handles a
      # repository's first push, and needs a licence for organisations).
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3
          git /repo --config /repo/.gitleaks.toml --redact --no-banner
