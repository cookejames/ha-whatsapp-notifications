[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv", "whatsapp_gateway"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "BLE", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=custom_components.whatsapp --cov-report=term-missing"
